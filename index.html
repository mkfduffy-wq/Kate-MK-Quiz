<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Are you more like Mary-Kate or Kate?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f4f8f6;
    --surface: #ffffff;
    --ink: #17241f;
    --muted: #5a6b64;
    --line: #d5e0db;
    --a: #1fa85a;      /* Mary-Kate: green */
    --a-ink: #06210f;
    --b: #2f4bff;      /* Kate: blue */
    --b-ink: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101a16;
      --surface: #19261f;
      --ink: #eef6f2;
      --muted: #9db0a8;
      --line: #2c3f36;
      --a: #3ddc84;
      --a-ink: #04200f;
      --b: #6b82ff;
      --b-ink: #0d1240;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101a16;
    --surface: #19261f;
    --ink: #eef6f2;
    --muted: #9db0a8;
    --line: #2c3f36;
    --a: #3ddc84;
    --a-ink: #04200f;
    --b: #6b82ff;
    --b-ink: #0d1240;
    color-scheme: dark;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 18px;
    line-height: 1.5;
    min-height: 100vh;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 22px 64px; }
  h1, h2 {
    font-family: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
    letter-spacing: -0.02em; line-height: 1.08; margin: 0;
  }
  h1 { font-size: clamp(2.3rem, 9vw, 3.6rem); font-weight: 800; }
  h2 { font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 700; }
  p { margin: 0; }

  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus-visible { outline: 3px solid var(--b); outline-offset: 3px; }

  .intro { margin-top: 18px; }
  .intro p { color: var(--muted); max-width: 46ch; }

  .primary {
    margin-top: 28px;
    background: var(--ink); color: var(--bg);
    border: 0; border-radius: 14px;
    padding: 14px 26px; font-weight: 700;
  }
  .primary:hover { transform: translateY(-1px); }

  #question { margin-top: 32px; }
  .progress { color: var(--muted); font-size: .95rem; margin-bottom: 10px; }
  .answers { display: grid; gap: 12px; margin-top: 24px; }
  .answer {
    text-align: left;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    transition: border-color .15s, transform .15s;
  }
  .answer:hover { border-color: var(--ink); }
  .answer:active { transform: scale(.985); }
  .answer[disabled] { pointer-events: none; }
  .answer.picked { border-color: var(--ink); }

  /* Result screen */
  #result { margin-top: 32px; }
  .verdict {
    font-size: clamp(2.4rem, 10vw, 4rem);
    font-weight: 800;
    padding: 36px 26px;
    border-radius: 22px;
    background: var(--a); color: var(--a-ink);
  }
  .verdict.is-b { background: var(--b); color: var(--b-ink); }
  .verdict.is-tie { background: var(--ink); color: var(--bg); }
  .again { background: transparent; border: 2px solid var(--ink); color: var(--ink); }

  .tug { margin-top: 56px; }
  .tug-names {
    display: flex; justify-content: space-between;
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700; font-size: 1.05rem; margin-bottom: 8px;
  }
  .tug-bar { display: flex; height: 22px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .tug-a { background: var(--a); width: 50%; transition: width .7s cubic-bezier(.3,1.3,.5,1); }
  .tug-b { background: var(--b); flex: 1; }
  .tug-pct {
    display: flex; justify-content: space-between;
    color: var(--muted); font-size: .95rem; margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>

  <section id="intro" class="intro">
    <p id="introText"></p>
    <button class="primary" id="startBtn">Start the quiz</button>
  </section>

  <section id="question" hidden>
    <p class="progress" id="progress"></p>
    <h2 id="qText"></h2>
    <div class="answers" id="answers"></div>
  </section>

  <section id="result" hidden>
    <h2 class="verdict" id="verdict"></h2>
    <button class="primary again" id="againBtn">Take it again</button>

    <div class="tug">
      <div class="tug-names"><span id="nameA"></span><span id="nameB"></span></div>
      <div class="tug-bar" role="img" id="tugLabel"><div class="tug-a" id="tugA"></div><div class="tug-b"></div></div>
      <div class="tug-pct"><span id="pctA"></span><span id="pctB"></span></div>
    </div>
  </section>
</main>

<script>
/* ============================================================
   EDIT THIS SECTION to change names, questions, or wording.
   Each answer's "who" is "a" (Mary-Kate) or "b" (Kate).
   ============================================================ */
const CONFIG = {
  nameA: "Mary-Kate",
  nameB: "Kate",
  intro: "Six quick questions. Answer honestly and find out which one you are.",
  questions: [
    { q: "Be honest: what does your room look like right now?",
      options: [
        { t: "Clothes on every surface, but I know where everything is", who: "a" },
        { t: "Everything has a place, and everything is in it", who: "b" } ] },
    { q: "Last round’s on you. What are you ordering?",
      options: [
        { t: "Vodka", who: "a" },
        { t: "Tequila", who: "b" } ] },
    { q: "You’re dead sober at a party and see a solo cup with some liquid in it. Do you drink it?",
      options: [
        { t: "Yes", who: "a" },
        { t: "No", who: "b" } ] },
    { q: "Your destination is 20 minutes away. How do you get there?",
      options: [
        { t: "Call an Uber", who: "a" },
        { t: "Walk", who: "b" } ] },
    { q: "You’re really thirsty. What do you grab?",
      options: [
        { t: "A soda", who: "a" },
        { t: "A big glass of water", who: "b" } ] },
    { q: "At a group dinner, you’re most likely to…",
      options: [
        { t: "Keep talking, even after the table has gone quiet", who: "a" },
        { t: "Listen for a while and jump in when I have something to say", who: "b" } ] }
  ]
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const total = CONFIG.questions.length;
let idx = 0, scoreA = 0, scoreB = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(id) {
  ["intro", "question", "result"].forEach(s => { $(s).hidden = (s !== id); });
}

function renderQuestion() {
  const item = CONFIG.questions[idx];
  $("progress").textContent = "Question " + (idx + 1) + " of " + total;
  $("qText").textContent = item.q;
  const box = $("answers");
  box.textContent = "";
  shuffle(item.options).forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = opt.t;
    btn.addEventListener("click", () => choose(opt.who, btn));
    box.appendChild(btn);
  });
  show("question");
}

function choose(who, btn) {
  document.querySelectorAll(".answer").forEach(b => b.disabled = true);
  btn.classList.add("picked");
  if (who === "a") scoreA++; else scoreB++;
  setTimeout(() => {
    idx++;
    if (idx < total) renderQuestion(); else showResult();
  }, 400);
}

function showResult() {
  const pctA = Math.round((scoreA / total) * 100);
  const pctB = 100 - pctA;
  const isTie = scoreA === scoreB;   // possible with an even number of questions
  const isA = scoreA > scoreB;
  const v = $("verdict");
  v.textContent = isTie
    ? "You’re half " + CONFIG.nameA + ", half " + CONFIG.nameB
    : "You are " + (isA ? CONFIG.nameA : CONFIG.nameB);
  v.classList.toggle("is-b", !isTie && !isA);
  v.classList.toggle("is-tie", isTie);

  $("nameA").textContent = CONFIG.nameA;
  $("nameB").textContent = CONFIG.nameB;
  $("pctA").textContent = pctA + "%";
  $("pctB").textContent = pctB + "%";
  $("tugLabel").setAttribute("aria-label",
    CONFIG.nameA + " " + pctA + " percent, " + CONFIG.nameB + " " + pctB + " percent");
  $("tugA").style.width = "50%";
  show("result");
  window.scrollTo({ top: 0, behavior: "smooth" });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $("tugA").style.width = pctA + "%";
  }));
}

function reset() {
  idx = 0; scoreA = 0; scoreB = 0;
  renderQuestion();
}

function init() {
  const t = "Are you more like " + CONFIG.nameA + " or " + CONFIG.nameB + "?";
  document.title = t;
  $("title").textContent = t;
  $("introText").textContent = CONFIG.intro;
  $("startBtn").addEventListener("click", reset);
  $("againBtn").addEventListener("click", reset);
}
init();
</script>
</body>
</html>
